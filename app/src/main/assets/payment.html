<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pagamento Seguro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            color: #aaa;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus {
            border-color: #10B981;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .input-group {
            flex: 1;
        }
        .pay-btn {
            width: 100%;
            padding: 16px;
            background: #10B981;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s ease, background 0.3s ease;
        }
        .pay-btn:active {
            transform: scale(0.97);
        }
        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
        .secure-badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>Vera Watt</h2>
            <p>Adicionar Método de Pagamento</p>
        </div>

        <div class="input-group">
            <label>Número do Cartão</label>
            <input type="tel" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>

        <div class="row">
            <div class="input-group">
                <label>Validade</label>
                <input type="tel" id="expiry" placeholder="MM/AA" maxlength="5">
            </div>
            <div class="input-group">
                <label>CVC</label>
                <input type="password" id="cvc" placeholder="123" maxlength="3">
            </div>
        </div>

        <div class="input-group">
            <label>Nome no Cartão</label>
            <input type="text" id="cardName" placeholder="O seu nome">
        </div>

        <button class="pay-btn" id="submitBtn">Confirmar Cartão</button>

        <div class="secure-badge">
            <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
            </svg>
            Pagamento 100% Seguro
        </div>
    </div>

    <script>
        // Formata o cartao automaticamente
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            var target = e.target;
            var position = target.selectionEnd;
            var length = target.value.length;
            target.value = target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
            target.selectionEnd = position += ((target.value.charAt(position - 1) === ' ' && target.value.charAt(length - 1) === ' ' && length !== target.value.length) ? 1 : 0);
        });

        // Formata a validade
        document.getElementById('expiry').addEventListener('input', function (e) {
            var target = e.target;
            target.value = target.value.replace(/[^\d]/g, '').replace(/^(\d{2})/, '$1/').trim();
        });

        document.getElementById('submitBtn').addEventListener('click', function() {
            var card = document.getElementById('cardNumber').value.replace(/\s/g, '');
            if(card.length < 15) {
                alert("Por favor insira um cartão válido!");
                return;
            }
            this.innerText = "A processar...";
            this.style.background = "#059669";
            
            setTimeout(() => {
                var last4 = card.slice(-4);
                // Envia para o Android!
                if(window.Android) {
                    window.Android.paymentComplete("**** " + last4);
                } else {
                    alert("Sucesso! (Modo Web): Cartão terminado em " + last4);
                }
            }, 1500);
        });
    </script>
</body>
</html>
